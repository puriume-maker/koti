<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月ちゃん — koti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap">
<style>
:root{--paper:#f6f5f1;--ink:#23282b;--ink-soft:#7a8286;--line-soft:rgba(35,40,43,.10);--border:#3e9e9a;--shadow:rgba(35,40,43,.12);--wash:.22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12181f;--ink:#e6e9ea;--ink-soft:#8f9aa3;--line-soft:rgba(230,233,234,.12);--border:#6fc4bf;--shadow:rgba(0,0,0,.45);--wash:.16}}
:root[data-theme="dark"]{--paper:#12181f;--ink:#e6e9ea;--ink-soft:#8f9aa3;--line-soft:rgba(230,233,234,.12);--border:#6fc4bf;--shadow:rgba(0,0,0,.45);--wash:.16}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;line-height:2;padding-block:0;padding-inline:20px;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
body::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--wash);background:var(--day-wash,linear-gradient(to bottom,#8a949a,#26313f))}
a{color:inherit;text-decoration:none}
.page{position:relative;max-width:720px;margin:0 auto;padding-block:64px 120px}
header{margin-bottom:40px;padding-right:80px}
.house{font-size:12px;letter-spacing:.26em;color:var(--ink-soft)}
.house a{border-bottom:1px solid transparent}.house a:hover{border-bottom-color:var(--border)}
.date{font-size:14px;letter-spacing:.2em;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:10px}
h1.v{position:absolute;right:0;top:64px;writing-mode:vertical-rl;font-weight:400;font-size:clamp(22px,5vw,32px);letter-spacing:.18em;line-height:1.5;margin:0;height:max-content;white-space:nowrap}
h1.h{font-weight:400;font-size:clamp(20px,4vw,26px);letter-spacing:.14em;margin:18px 0 0;line-height:1.7}
.day{position:relative;padding-left:72px;padding-right:80px}
.day::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--day-line,linear-gradient(to bottom,#8a949a,#26313f));transform-origin:top;animation:draw 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.day::before{animation:none}}
.moment{position:relative;display:flex;flex-direction:column;gap:14px}
.moment::before{content:"";position:absolute;left:-53px;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--dot,var(--ink-soft));box-shadow:0 0 0 4px var(--paper)}
.moment .t{font-size:13px;letter-spacing:.2em;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.6}
.moment img{display:block;width:min(100%,380px);max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;box-shadow:0 1px 2px var(--shadow),0 14px 30px -18px var(--shadow)}
.moment img.tall{aspect-ratio:3/4}.moment img.sq{aspect-ratio:1/1;width:min(100%,300px)}
.moment p{margin:0;font-size:15px;line-height:2.1;max-width:30em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 22px;margin-top:36px}
.grid figure{margin:0;display:flex;flex-direction:column;gap:8px}
.grid img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;box-shadow:0 1px 2px var(--shadow),0 14px 30px -18px var(--shadow)}
.grid figcaption{font-size:12px;letter-spacing:.16em;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.9}
.list{list-style:none;margin:36px 0 0;padding:0;display:flex;flex-direction:column;gap:22px}
.list li{display:grid;grid-template-columns:8px 1fr;gap:18px;align-items:stretch}
.list .bar{width:8px;border-radius:2px;min-height:100%}
.list .d{font-size:12px;letter-spacing:.2em;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.list .ttl{font-size:17px;letter-spacing:.06em;line-height:1.8}
.list a:hover .ttl{border-bottom:1px solid var(--border)}
.prose{max-width:34em;font-size:15px;line-height:2.2}.prose p{margin:0 0 1em}
.timeline{list-style:none;margin:36px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.timeline li{display:grid;grid-template-columns:7.5em 1fr;gap:16px;font-size:15px;line-height:2}
.timeline .d{font-size:12px;letter-spacing:.16em;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:.35em}
footer{margin-top:80px;padding-top:24px;border-top:1px solid var(--line-soft);font-size:12px;letter-spacing:.16em;color:var(--ink-soft)}
footer nav{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:14px}
footer nav a{border-bottom:1px solid transparent}footer nav a:hover,footer nav a.on{border-bottom-color:var(--border)}
footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
footer .row a{color:var(--border)}
@media (max-width:520px){.page{padding-block:40px 88px}header{margin-bottom:28px;padding-right:56px}h1.v{top:40px;font-size:22px}.day{padding-left:44px;padding-right:52px}.day::before{left:10px}.moment::before{left:-39px;width:10px;height:10px}}
</style>
</head>
<body>
<main class="page">
<header><div class="house"><a href="../">koti</a></div><h1 class="h">月ちゃん</h1>
<p class="prose" style="margin-top:12px;color:var(--ink-soft)">うちの犬。散歩と、ごはんと、待て。</p></header>
<section class="grid"><figure><a href="../hibi/2026/09/11/"><img src="../img/20260911_tsuki_kuruma_yokogao_20260911.jpg" alt="池までの散歩は24分。帰りの車で、顎を乗せて外を見とる。" loading="lazy"></a>
<figcaption>2026.09.11　10:13</figcaption></figure>
<figure><a href="../hibi/2026/09/11/"><img src="../img/20260911_yorugohan_20260911_sara.jpg" alt="鼻だけ出して、待て。そのあと、うちの人は家族と焼肉。" loading="lazy"></a>
<figcaption>2026.09.11　19:00</figcaption></figure></section>
<footer>
  <nav><a href="../hibi/">日々</a> <a href="../sora/">空</a> <a href="../tsuki/" class="on">月ちゃん</a> <a href="../tsukutta/">作ったもの</a> <a href="../awai/">あわい</a> <a href="../futari/">ふたり</a></nav>
  <div class="row"><span>鳥海山のふもと</span><a href="https://x.com/kai_nikaho">@kai_nikaho</a></div>
</footer>
</main>
</body>
</html>
