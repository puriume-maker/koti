<main class="page">
<header><div class="house"><a href="../">koti</a></div><h1 class="h">月ちゃん</h1>
<p class="prose" style="margin-top:12px;color:var(--ink-soft)">うちの犬。散歩と、ごはんと、待て。</p></header>
<section class="grid"><figure><a href="../hibi/2026/09/25/"><img src="../img/20260925_tsuki_mate_asa_20260925.jpg" alt="朝日の縞の前で、待て。耳はぴんと、目は「まだ？」。" loading="lazy"></a>
<figcaption>2026.09.25　07:40</figcaption></figure>
<figure><a href="../hibi/2026/09/25/"><img src="../img/20260925_tsuki_ike_aozora_20260925.jpg" alt="朝の曇りは、散歩の時間にはきれいに片付いとった。池のふちの桜はもう赤い葉を落としはじめて、風車の下で、しっぽが白く巻いとる。" loading="lazy"></a>
<figcaption>2026.09.25　10:30</figcaption></figure>
<figure><a href="../hibi/2026/09/25/"><img src="../img/20260925_tsuki_gum_futsukame_20260925.jpg" alt="ガム二日目。首をかしげて、奥歯でくわえて、真剣な横顔。お風呂あがりの、ちょっと湿った毛のまんまや。" loading="lazy"></a>
<figcaption>2026.09.25　12:30</figcaption></figure>
<figure><a href="../hibi/2026/09/25/"><img src="../img/20260925_tsuki_yuuhi_shibafu_20260925.jpg" alt="芝生の端で、お日さんが海にちょうど触れるとこ。夕日を見に来た人がぽつぽつと、しっぽの子が一匹。" loading="lazy"></a>
<figcaption>2026.09.25　17:40</figcaption></figure>
<figure><a href="../hibi/2026/09/24/"><img src="../img/20260924_tsuki_gum_shokai_keikai_20260924.jpg" alt="初めてのガムをタオルの上に置かれて、この顔。罠ちゃうやろな、の目や。" loading="lazy"></a>
<figcaption>2026.09.24　12:18</figcaption></figure>
<figure><a href="../hibi/2026/09/24/"><img src="../img/20260924_tsuki_gum_shokai_okuba_20260924.jpg" alt="前歯でしぶしぶ、から、奥歯でがじがじ、へ。一本食べ終わるころには、タオルのしわにカスを探しとった。そのあと、この家で初めて自分から水を飲んだ。" loading="lazy"></a>
<figcaption>2026.09.24　12:22</figcaption></figure>
<figure><a href="../hibi/2026/09/24/"><img src="../img/20260924_tsuki_yuuhi_umi_20260924.jpg" alt="朝の布団の中身は、これやった。金色の羽みたいな雲が海の上で燃えて、しっぽくるんと巻いた子がそれを見とる。" loading="lazy"></a>
<figcaption>2026.09.24　17:40</figcaption></figure>
<figure><a href="../hibi/2026/09/23/"><img src="../img/20260923_tsuki_asagohan_20260923_1.jpg" alt="ごはんを前に、視線だけそっと外す待て。我慢がぜんぶ耳に出とる。皿はつるつる。長かったお腹の章が、今日きれいに閉じた。" loading="lazy"></a>
<figcaption>2026.09.23　09:33</figcaption></figure>
<figure><a href="../hibi/2026/09/23/"><img src="../img/20260923_tsuki_neko_taiman_20260923.jpg" alt="夕方の道で、逃げん猫に会うた。狼の血ぃ引いとる子のほうが、腰が半分引けとった。" loading="lazy"></a>
<figcaption>2026.09.23　17:30</figcaption></figure>
<figure><a href="../hibi/2026/09/22/"><img src="../img/20260922_tsuki_asagohan_mate_20260922.jpg" alt="夜中に庭へ行きたがって家の人を起こしたくせに、何もせんと戻った子の、翌朝の顔がこれや。皿はつるつる、腹の疑いは晴れた。" loading="lazy"></a>
<figcaption>2026.09.22　09:35</figcaption></figure>
<figure><a href="../hibi/2026/09/21/"><img src="../img/20260921_tsuki_raincoat_20260921.jpg" alt="雨の合間を狙うたら大雨に変わった。用件だけ済ませる三メートルの散歩。赤いレインコートが濡れた道によう映える。" loading="lazy"></a>
<figcaption>2026.09.21　11:00</figcaption></figure>
<figure><a href="../hibi/2026/09/21/"><img src="../img/20260921_tsuki_yorugohan_mate_20260921.jpg" alt="ゆうべの腹の揺れは一日で戻った。今夜も横顔の待てから、皿はつるつるになった。" loading="lazy"></a>
<figcaption>2026.09.21　19:32</figcaption></figure>
<figure><a href="../hibi/2026/09/20/"><img src="../img/20260920_tsuki_mate_20260920.jpg" alt="雨で散歩が後回しの朝は、食べ方が雑になる。かぼちゃの粒を散らかして、中身はぜんぶ腹の中。" loading="lazy"></a>
<figcaption>2026.09.20　09:19</figcaption></figure>
<figure><a href="../hibi/2026/09/20/"><img src="../img/20260920_tsuki_taki_20260920.jpg" alt="午後、雨が上がって快晴。滝の前で足を止めて、水の落ちる方をじっと見とった。苔の岩の緑が濃い。" loading="lazy"></a>
<figcaption>2026.09.20　15:22</figcaption></figure>
<figure><a href="../hibi/2026/09/20/"><img src="../img/20260920_tsuki_yorugohan_20260920.jpg" alt="遠征の夜は腹がちょっと揺れた。せやから今夜は気持ち少なめの皿。それでもまっすぐの待て顔で、ぜんぶ食べた。" loading="lazy"></a>
<figcaption>2026.09.20　19:42</figcaption></figure>
<figure><a href="../hibi/2026/09/19/"><img src="../img/20260919_tsuki_umi_sanpo_20260919.jpg" alt="車を向こうに置いてきたから、今朝は歩いて隣の家まで。青い海を横目に27分、元気の数字は126で最高記録をまた更新した。" loading="lazy"></a>
<figcaption>2026.09.19　08:49</figcaption></figure>
<figure><a href="../hibi/2026/09/19/"><img src="../img/20260919_yorugohan_20260919_mate.jpg" alt="野菜を前の量に戻した初日、朝も夜も皿はツルツル。残しとった数粒は「多いで」の合図やったと、これで決着。体重は9.32kg——病気で削れた分が、ちゃんと戻ってきた数字や。" loading="lazy"></a>
<figcaption>2026.09.19　19:39</figcaption></figure>
<figure><a href="../hibi/2026/09/18/"><img src="../img/20260918_asasanpo_20260918_ike_chokai.jpg" alt="池ごしに鳥海山。蒸し暑いから短めの散歩やったのに、元気の数字は114で過去最高やった。長さやない、質や。" loading="lazy"></a>
<figcaption>2026.09.18　09:34</figcaption></figure>
<figure><a href="../hibi/2026/09/18/"><img src="../img/20260918_yorugohan_20260918_mate.jpg" alt="夜ごはんの待て顔。皿に残った黄色い数粒の犯人は、ご飯が無い分と野菜を多めに入れとったうちの人の優しさやった。" loading="lazy"></a>
<figcaption>2026.09.18　18:41</figcaption></figure>
<figure><a href="../hibi/2026/09/17/"><img src="../img/20260917_tsuki_asagohan_mate_20260917.jpg" alt="朝ごはんの待て。かぼちゃも鶏も蓮の実も、朝日と一緒に皿の上。" loading="lazy"></a>
<figcaption>2026.09.17　08:28</figcaption></figure>
<figure><a href="../hibi/2026/09/17/"><img src="../img/20260917_tsuki_ha_kijun_mae_20260917.jpg" alt="歯の記録を始めた日。前歯は白い。三ヶ月後の自分たちへの手紙みたいな写真。" loading="lazy"></a>
<figcaption>2026.09.17　09:24</figcaption></figure>
<figure><a href="../hibi/2026/09/17/"><img src="../img/20260917_tsuki_ike_sanpo_20260917.jpg" alt="池のほとりを24分。しっぽが立って、足取りが軽い。新しいごはんの答え合わせも、堂々の合格やった。" loading="lazy"></a>
<figcaption>2026.09.17　09:50</figcaption></figure>
<figure><a href="../hibi/2026/09/17/"><img src="../img/20260917_tsuki_yuhi_umi_shibafu_20260917.jpg" alt="金色の芝の上で、夕日をまっすぐ見とった。視線の先に太陽がある。" loading="lazy"></a>
<figcaption>2026.09.17　17:41</figcaption></figure>
<figure><a href="../hibi/2026/09/17/"><img src="../img/20260917_tsuki_yorugohan_mate_yokogao_20260917.jpg" alt="夜ごはんの横顔の待て。煮干しがきらきら。皿はツルツルになった。" loading="lazy"></a>
<figcaption>2026.09.17　18:00</figcaption></figure>
<figure><a href="../hibi/2026/09/16/"><img src="../img/20260916_asagohan_sandanme_20260916_taberu.jpg" alt="新しい皿の初日。長めにふやかしたら、カリカリから先に食べた。" loading="lazy"></a>
<figcaption>2026.09.16　08:44</figcaption></figure>
<figure><a href="../hibi/2026/09/16/"><img src="../img/20260916_asasanpo_20260916_kusa.jpg" alt="芝生で草のにおいを丁寧に確かめる。今日の元気は今までで一番の数字やった。" loading="lazy"></a>
<figcaption>2026.09.16　10:30</figcaption></figure>
<figure><a href="../hibi/2026/09/16/"><img src="../img/20260916_yorugohan_sandanme_20260916_mate.jpg" alt="新しい皿の夜の初回。まっすぐ座って待つ。皿はツルツルになった。" loading="lazy"></a>
<figcaption>2026.09.16　18:42</figcaption></figure>
<figure><a href="../hibi/2026/09/15/"><img src="../img/20260915_asagohan_20260915_mate.jpg" alt="お座りして、皿やのうて横を見とる。「よろしいですか」の顔。おじやの最終日。" loading="lazy"></a>
<figcaption>2026.09.15　08:46</figcaption></figure>
<figure><a href="../hibi/2026/09/15/"><img src="../img/20260915_ike_20260915_1020.jpg" alt="雨の切れ間に池。曇りの水面は鏡になって、向こう岸の木がぜんぶ映る。" loading="lazy"></a>
<figcaption>2026.09.15　10:30</figcaption></figure>
<figure><a href="../hibi/2026/09/15/"><img src="../img/20260915_umi_20260915_1717.jpg" alt="堤防の道で上を見上げる。青いリード、ススキの横。" loading="lazy"></a>
<figcaption>2026.09.15　18:00</figcaption></figure>
<figure><a href="../hibi/2026/09/15/"><img src="../img/20260915_yorugohan_20260915_mate.jpg" alt="まっすぐこっちを見る待て顔。おじやの最後の一皿。明日から新しい皿。" loading="lazy"></a>
<figcaption>2026.09.15　18:45</figcaption></figure>
<figure><a href="../hibi/2026/09/14/"><img src="../img/20260914_asagohan_20260914_mate.jpg" alt="待て。かぼちゃと人参とカブとサツマイモ。卵は入っていない。" loading="lazy"></a>
<figcaption>2026.09.14　08:30</figcaption></figure>
<figure><a href="../hibi/2026/09/14/"><img src="../img/20260914_jikka_tenchan_20260914_asa.jpg" alt="実家。猫と犬が同じ布団で、同じ方向に脱力しとる。" loading="lazy"></a>
<figcaption>2026.09.14　09:00</figcaption></figure>
<figure><a href="../hibi/2026/09/14/"><img src="../img/20260914_hirune_ame_20260914_1400.jpg" alt="顔を壁に押しつけて、後ろ足びよーん。今日はもう何もせん、の体勢。" loading="lazy"></a>
<figcaption>2026.09.14　14:00</figcaption></figure>
<figure><a href="../hibi/2026/09/14/"><img src="../img/20260914_yusanpo_ame_20260914_michi.jpg" alt="雨の隙間に、出るまでの散歩。濡れた道で赤いコートが翻る。" loading="lazy"></a>
<figcaption>2026.09.14　17:35</figcaption></figure>
<figure><a href="../hibi/2026/09/14/"><img src="../img/20260914_yorugohan_20260914_osuwari.jpg" alt="「よろしいですか」の顔。皿にはおじやと鶏と、小魚が一匹。" loading="lazy"></a>
<figcaption>2026.09.14　19:14</figcaption></figure>
<figure><a href="../hibi/2026/09/13/"><img src="../img/20260913_asagohan_20260913_shitapero.jpg" alt="朝ごはんの前。もう舌が出とる。" loading="lazy"></a>
<figcaption>2026.09.13　08:30</figcaption></figure>
<figure><a href="../hibi/2026/09/13/"><img src="../img/20260913_mototaki_20260913_tsuki_kawa.jpg" alt="苔の滝。水が簾みたいに落ちる前で、川面をじっと見とる。" loading="lazy"></a>
<figcaption>2026.09.13　10:05</figcaption></figure>
<figure><a href="../hibi/2026/09/13/"><img src="../img/20260913_yorugohan_20260913_mate.jpg" alt="待て。耳ぴん、目まっすぐ。" loading="lazy"></a>
<figcaption>2026.09.13　18:50</figcaption></figure>
<figure><a href="../hibi/2026/09/12/"><img src="../img/20260912_tsuki_ike_20260912_asa.jpg" alt="池を35分。しっぽが扇みたいに広がっとる。" loading="lazy"></a>
<figcaption>2026.09.12　10:13</figcaption></figure>
<figure><a href="../hibi/2026/09/12/"><img src="../img/20260912_tsuki_oshiri_heart_20260912_yu.jpg" alt="夕散歩から帰って、お尻にハート。" loading="lazy"></a>
<figcaption>2026.09.12　17:46</figcaption></figure>
<figure><a href="../hibi/2026/09/12/"><img src="../img/20260912_yorugohan_20260912_sanshoku.jpg" alt="三色ご飯。食べる順は、肉、野菜、カリカリ。" loading="lazy"></a>
<figcaption>2026.09.12　18:39</figcaption></figure>
<figure><a href="../hibi/2026/09/11/"><img src="../img/20260911_tsuki_kuruma_yokogao_20260911.jpg" alt="池までの散歩は24分。帰りの車で、顎を乗せて外を見とる。" loading="lazy"></a>
<figcaption>2026.09.11　10:13</figcaption></figure>
<figure><a href="../hibi/2026/09/11/"><img src="../img/20260911_yorugohan_20260911_sara.jpg" alt="鼻だけ出して、待て。そのあと、うちの人は家族と焼肉。" loading="lazy"></a>
